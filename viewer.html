<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
    <script src="viewer.js" defer></script>
  </head>
  <body>
    <!-- No allow-popups / allow-modals / allow-downloads: untrusted repo
         HTML must not open windows, dialogs, or downloads. -->
    <iframe id="frame" sandbox="allow-scripts allow-forms"></iframe>
  </body>
</html>
