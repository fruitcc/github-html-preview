<!doctype html>
<html><head><meta charset="utf-8"><title>Small promo tile</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 440px; height: 280px; position: relative; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .row { display: flex; align-items: center; gap: 18px; }
  .glyph { width: 74px; height: 92px; }
  .arrow { font-size: 30px; opacity: .75; font-weight: 300; }
  /* mini rendered page */
  .page { width: 112px; height: 92px; background: #fff; border-radius: 8px; padding: 9px; box-shadow: 0 6px 14px rgba(2,26,64,.35); display: flex; flex-direction: column; gap: 6px; }
  .page .h { height: 10px; width: 70%; border-radius: 3px; background: #1f2328; }
  .page .l { height: 6px; border-radius: 3px; background: #d8dee4; }
  .page .bars { flex: 1; display: flex; align-items: flex-end; gap: 5px; padding-top: 4px; }
  .page .bars i { flex: 1; border-radius: 2px 2px 0 0; background: #2b8cff; }
  .page .bars i:nth-child(2n) { background: #1a7f37; }
  h1 { font-size: 40px; font-weight: 800; letter-spacing: -.8px; line-height: 1; text-shadow: 0 2px 10px rgba(2,26,64,.3); }
  p { font-size: 19px; font-weight: 600; color: #d6e6fa; letter-spacing: -.1px; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="row">
      <img class="glyph" src="doc-glyph.svg" alt="">
      <div class="arrow">→</div>
      <div class="page">
        <div class="h"></div><div class="l"></div><div class="l" style="width:80%"></div>
        <div class="bars"><i style="height:45%"></i><i style="height:80%"></i><i style="height:60%"></i><i style="height:100%"></i><i style="height:70%"></i></div>
      </div>
    </div>
    <h1>GitHub HTML Preview</h1>
    <p>See .html files as pages, not code</p>
  </div>
</body></html>
